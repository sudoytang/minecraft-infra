[package]
name = "minecraft-afk-azalea"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea" }
eyre = "0.6"
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
