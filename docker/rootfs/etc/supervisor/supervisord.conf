[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
logfile=/var/log/minecraft/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
[program:paper]
command=/usr/local/bin/run-paper
directory=/srv/minecraft
autostart=true
autorestart=unexpected
exitcodes=0,130,143
startsecs=20
startretries=5
stopsignal=INT
stopwaitsecs=110
stdout_logfile=/var/log/minecraft/paper.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
priority=10

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/var/log/minecraft/sshd.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true
priority=5

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
stdout_logfile=/var/log/minecraft/cron.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true
priority=5

[program:afk]
command=/usr/local/bin/run-afk
directory=/home/ytang/minecraft-afk-bot
user=ytang
environment=NODE_ENV="production",HOME="/home/ytang",NODE_OPTIONS="--max-old-space-size=192"
autostart=false
autorestart=true
startsecs=0
stdout_logfile=/var/log/minecraft/afk.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
priority=20

[eventlistener:notify]
command=/usr/local/bin/supervisor-notify
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
stdout_logfile=/var/log/minecraft/notify-listener.log
stderr_logfile=/var/log/minecraft/notify-listener.log

[program:afk-azalea]
command=/usr/local/bin/run-afk-azalea
directory=/home/ytang/minecraft-afk-azalea
user=ytang
environment=HOME="/home/ytang",RUST_LOG="warn",AUTHME_PASSWORD_FILE="/home/ytang/minecraft-afk-azalea/authme-password",AUTHME_PASSWORD_FILE_MAIN="/home/ytang/minecraft-afk-bot/authme-password"
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/var/log/minecraft/afk-azalea.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
priority=25
